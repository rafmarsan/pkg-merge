name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
            artifact: pkg-merge-linux-x86_64
            lint: true
          - runner: ubuntu-24.04-arm
            arch: arm64
            artifact: pkg-merge-linux-arm64
            lint: false
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias de native-tls
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Comprobar formato
        if: matrix.lint
        run: cargo fmt --all -- --check
      - name: Clippy
        if: matrix.lint
        run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all --locked
      - run: cargo build --release --locked
      - run: mkdir -p dist && cp target/release/pkg-merge "dist/${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all --locked
      - run: cargo build --release --locked
      - name: Preparar artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/pkg-merge.exe dist/pkg-merge-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-merge-windows-x64
          path: dist/pkg-merge-windows-x64.exe
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
